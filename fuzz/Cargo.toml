[package]
name         = "mk-fuzz"
version      = "0.0.0"
publish      = false
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# cargo-fuzz requires binary names to match fuzz_targets/*.rs filenames.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
libfuzzer-sys = "0.4"
mk-bridge     = { path = "../crates/mk-bridge" }
mk-core       = { path = "../crates/mk-core", features = ["testing"] }
# cgka-traits / openmls name the storage traits `kv_rows` exercises; the same
# pinned revisions as the root workspace.
cgka-traits    = { git = "https://github.com/marmot-protocol/mdk", rev = "a2e0558a634bbd20607cdd5afb93abc6220ee58d", version = "=0.16.0" }
openmls        = { git = "https://github.com/openmls/openmls.git", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2", version = "=0.9.0", features = ["extensions-draft"] }
openmls_traits = { git = "https://github.com/openmls/openmls.git", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2", version = "=0.6.0", features = ["extensions-draft"] }
serde_json     = "1"
tokio          = { version = "1", features = ["macros", "rt-multi-thread"] }

# Standalone cargo-fuzz workspace: excluded from the root workspace.
[workspace]

[[bin]]
name = "kv_batch"
path = "fuzz_targets/kv_batch.rs"
test = false
doc  = false

[[bin]]
name = "kv_rows"
path = "fuzz_targets/kv_rows.rs"
test = false
doc  = false

[[bin]]
name = "event_json"
path = "fuzz_targets/event_json.rs"
test = false
doc  = false

[[bin]]
name = "account_proof"
path = "fuzz_targets/account_proof.rs"
test = false
doc  = false

[[bin]]
name = "key_package_event"
path = "fuzz_targets/key_package_event.rs"
test = false
doc  = false

[[bin]]
name = "imeta_tag"
path = "fuzz_targets/imeta_tag.rs"
test = false
doc  = false

[[bin]]
name = "stream_anchor"
path = "fuzz_targets/stream_anchor.rs"
test = false
doc  = false

[[bin]]
name = "bridge_request"
path = "fuzz_targets/bridge_request.rs"
test = false
doc  = false

[[bin]]
name = "bridge_config"
path = "fuzz_targets/bridge_config.rs"
test = false
doc  = false

[[bin]]
name              = "gen_corpus"
path              = "src/bin/gen_corpus.rs"
test              = false
doc               = false
required-features = ["corpus-gen"]

[features]
corpus-gen = []
