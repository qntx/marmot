# Adopted releases must be at least 7 days old (cooldown). Minor and patch
# updates are grouped per ecosystem so the open-PR limit never fills up;
# majors stay individual PRs and are merged by hand. Cargo ecosystems below
# cover the root workspace and each standalone project; git-sourced
# dependencies (MDK, OpenMLS, the rust-nostr fork) are pinned deliberately in
# upstream.json and the manifests — pin bumps are a manual operation, so the
# ignore lists keep dependabot from ever proposing them.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Pinned git deps: bump only through upstream.json / manual review.
      - dependency-name: "cgka-*"
      - dependency-name: "transport-nostr-peeler"
      - dependency-name: "storage-sqlite"
      - dependency-name: "cgka-conformance-simulator"
      - dependency-name: "marmot-*"
      - dependency-name: "fs-private"
      - dependency-name: "openmls*"
      - dependency-name: "nostr*"
      # MDK (transport-nostr-peeler) and the rust-nostr fork pin base64 0.22,
      # so a newer line only adds a duplicate. Drop when the MDK pin moves.
      - dependency-name: "base64"
        versions: [">= 0.23"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
