name: M7 probe

# Temporary measurement jobs for the M7 CI lane; removed before review.

on:
  workflow_dispatch:
  push:
    branches: [ci/interop-release]
    paths: [".github/workflows/m7-probe.yml"]

permissions:
  contents: read

jobs:
  suite-log:
    strategy:
      fail-fast: false
      matrix:
        flags: ["cleared", "config"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: cargo test -p mk-core --all-features (as rust / ci runs it)
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -uo pipefail
          if [ "$FLAGS" = cleared ]; then export LIBSQLITE3_FLAGS=""; fi
          ulimit -l
          cargo test -p mk-core --all-features --no-run
          cargo test -p mk-core --all-features >suite.out 2>suite.err
          echo "exit $?"
          echo "stdout bytes $(wc -c <suite.out) stderr bytes $(wc -c <suite.err) mlock-warn lines $(grep -c 'sqlcipher_mlock' suite.err)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^test result|FAILED|panicked' suite.out | head -40
          gzip -9 suite.err
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-log-${{ matrix.flags }}
          path: |
            suite.out
            suite.err.gz
          retention-days: 7
