[package]
name                   = "mk-ffi"
description            = "Marmot kit FFI: a C ABI that surfaces the mk-bridge byte protocol to native hosts, one dedicated engine thread per handle."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories             = ["cryptography", "api-bindings"]
publish                = false

[lib]
name       = "marmot_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Test-only `mk_bridge_test_panic` export; never enabled in shipped builds.
test-panic = []

[dependencies]
mk-bridge = { path = "../mk-bridge", version = "=0.1.0" }
tokio     = { workspace = true }

[dev-dependencies]
cbindgen   = "=0.29.4"
hex        = { workspace = true }
mk-core    = { path = "../mk-core", version = "=0.1.0", features = ["testing"] }
serde_json = { workspace = true }

[lints]
workspace = true
