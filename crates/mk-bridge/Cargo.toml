[package]
name                   = "mk-bridge"
description            = "Marmot kit bridge: a byte-oriented host protocol that surfaces the mk-core session API to wasm and JavaScript hosts."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories             = ["cryptography", "network-programming"]
readme                 = "README.md"
publish                = false

[features]
default = []

[dependencies]
hex        = { workspace = true }
mk-core    = { path = "../mk-core", version = "=0.0.0" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
mk-core = { path = "../mk-core", version = "=0.0.0", features = ["testing"] }
tokio   = { workspace = true }

[lints]
workspace = true
