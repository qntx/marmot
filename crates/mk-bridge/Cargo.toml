[package]
name                   = "mk-bridge"
description            = "Marmot kit bridge: a byte-oriented host protocol that surfaces the mk-core session API to wasm and JavaScript hosts."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories             = ["cryptography", "network-programming"]
publish                = false

[features]
default = []

[dependencies]
hex        = { workspace = true }
mk-core    = { path = "../mk-core", version = "=0.3.0" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
dhat    = { workspace = true }
mk-core = { path = "../mk-core", version = "=0.3.0", features = ["testing"] }
tokio   = { workspace = true }
tracing = { workspace = true }

[[bench]]
name    = "scaling"
harness = false

[[bench]]
name    = "large_group"
harness = false

[[bench]]
name    = "heap_profile"
harness = false

[lints]
workspace = true
