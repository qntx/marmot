[toolchain]
# Pin to the workspace MSRV (edition 2024), exact patch version: codegen can
# change between patch releases. Bumping this requires updating rust-version
# under [workspace.package] in Cargo.toml.
channel    = "1.99.1"
# llvm-tools: marmot-markdown's build script finalizes its optimized Linux
# amd64 Odin objects with the toolchain's llc/opt/rust-lld/llvm-ar.
components = ["rustfmt", "clippy", "llvm-tools"]
targets    = ["wasm32-unknown-unknown"]
profile    = "minimal"
