[package]
name                   = "mk-core"
description            = "Marmot kit core: a pure-Rust persistent key-value storage provider for the MDK engine, plus the session API built on it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories             = ["cryptography", "network-programming"]
readme                 = "README.md"
publish                = false

[features]
default = []
# Public test/support helpers (`mk_core::testing`) used by this crate's
# integration tests and by the interop crate in later milestones.
testing = []

[dependencies]
base64                 = { workspace = true }
cgka-engine            = { workspace = true }
cgka-traits            = { workspace = true }
chacha20poly1305       = { workspace = true }
getrandom              = { workspace = true }
hex                    = { workspace = true }
hkdf                   = { workspace = true }
nostr                  = { workspace = true }
openmls                = { workspace = true }
openmls_traits         = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
sha2                   = { workspace = true }
thiserror              = { workspace = true }
transport-nostr-peeler = { workspace = true }
url                    = { workspace = true }
zeroize                = { workspace = true }


[dev-dependencies]
openmls_rust_crypto = { workspace = true }
proptest            = { workspace = true }
storage-sqlite      = { workspace = true }
tokio               = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `openmls` unconditionally uses `web_time` on wasm32; its `js` feature
# supplies that dep plus the `getrandom` wasm source.
openmls   = { workspace = true, features = ["js"] }
getrandom = { workspace = true, features = ["wasm_js"] }

[[test]]
name              = "rejoin"
required-features = ["testing"]

[[test]]
name              = "stall"
required-features = ["testing"]

[[test]]
name              = "model"
required-features = ["testing"]

[[test]]
name              = "selection"
required-features = ["testing"]

[[test]]
name              = "queued_intent"
required-features = ["testing"]

[lints]
workspace = true
